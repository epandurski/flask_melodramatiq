version: 2.0
jobs:
  build:
    docker:
      - image: python:3
    steps:
      - checkout
      - run:
          name: Run Tests
          command: |
            apt-get update && apt-get -y --no-install-recommends install rabbitmq-server
            pip install 'pytest~=8.4' 'pytest-cov~=7.0' 'mock~=5.2' 'pika>=0.13' 'redis>=3.4'
            pip install -e .
            pytest
workflows:
  version: 2
  commit:
    jobs:
      - build
  nightly:
    triggers:
      - schedule:
          cron: "30 5 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build
